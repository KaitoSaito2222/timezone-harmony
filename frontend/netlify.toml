[build]
  command = "npm run build"
  publish = ".next"
  # Skip the build (and its deploy credits) when nothing under frontend/ changed,
  # e.g. README-only or workflow-only commits.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
