name: Supabase keep-alive

# Supabase Free プランは 7 日間アクティビティがないと自動 pause されるため、
# 週2回 PostgREST 経由で DB にクエリを投げて pause を防ぐ。
on:
  schedule:
    - cron: '0 3 * * 1,4' # 月・木 03:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/health_checks?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
