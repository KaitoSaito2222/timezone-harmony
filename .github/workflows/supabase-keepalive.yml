name: Supabase keep-alive

# The Supabase Free plan auto-pauses projects after 7 days of inactivity,
# so query the DB through PostgREST twice a week to prevent it.
on:
  schedule:
    - cron: '0 3 * * 1,4' # Mon and Thu, 03:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/health_checks?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY"
